global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - alerts-exmarketing.rules.yml

scrape_configs:
  - job_name: exmarketing
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - localhost:8080
        labels:
          service: exmarketing
