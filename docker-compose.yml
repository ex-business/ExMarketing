services:
  postgres:
    image: postgres:16-alpine
    container_name: exmarketing-postgres
    environment:
      POSTGRES_DB: exmarketing
      POSTGRES_USER: exmarketing
      POSTGRES_PASSWORD: exmarketing
    ports:
      - "54329:5432"
    volumes:
      - exmarketing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exmarketing -d exmarketing"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  exmarketing-postgres-data:
