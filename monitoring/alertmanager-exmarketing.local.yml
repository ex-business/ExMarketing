global:
  resolve_timeout: 1m

route:
  receiver: platform-observability
  group_by: [service, env, severity, tenant, channel]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 10m
  routes:
    - receiver: backend-oncall-p0
      matchers:
        - service="exmarketing"
        - severity="P0"
        - owner="backend-oncall"
      repeat_interval: 5m
      continue: true
    - receiver: dba-infra-p0
      matchers:
        - service="exmarketing"
        - severity="P0"
        - owner="dba-infra"
      repeat_interval: 5m
      continue: true
    - receiver: business-ops
      matchers:
        - service="exmarketing"
        - severity=~"P0|P1"
        - alertname=~"ExMarketingQuotaOverDeductRisk|ExMarketingDLQGrowing|ExMarketingCallbackFailRateHigh"
      repeat_interval: 10m
      continue: true
    - receiver: backend-oncall
      matchers:
        - service="exmarketing"
        - severity="P1"
      repeat_interval: 10m
    - receiver: backend-workqueue
      matchers:
        - service="exmarketing"
        - severity="P2"
      repeat_interval: 30m
    - receiver: platform-observability
      matchers:
        - service="exmarketing"
        - severity="P3"
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - service="exmarketing"
      - alertname="ExMarketingDBWriteFailure"
      - severity="P0"
    target_matchers:
      - service="exmarketing"
      - alertname=~"ExMarketingOutboxBacklogHigh|ExMarketingCallbackFailRateHigh|ExMarketingWorkerAllStopped|ExMarketingEventIntakeErrorRateHigh|ExMarketingFactQueryFailRateHigh|ExMarketingRewardRetrySpike|ExMarketingClaimLatencyHigh"
    equal: [env, tenant]
  - source_matchers:
      - service="exmarketing"
      - alertname="ExMarketingDBWriteFailure"
      - severity="P0"
      - tenant="global"
    target_matchers:
      - service="exmarketing"
      - alertname=~"ExMarketingOutboxBacklogHigh|ExMarketingCallbackFailRateHigh|ExMarketingWorkerAllStopped|ExMarketingEventIntakeErrorRateHigh|ExMarketingFactQueryFailRateHigh|ExMarketingRewardRetrySpike|ExMarketingClaimLatencyHigh"
    equal: [env]
  - source_matchers:
      - service="exmarketing"
      - severity=~"P0|P1"
    target_matchers:
      - service="exmarketing"
      - severity=~"P2|P3"
    equal: [env, tenant, channel]

receivers:
  - name: backend-oncall-p0
    webhook_configs:
      - url: http://exmarketing-alert-drill:8080/alertmanager/backend-oncall-p0
        send_resolved: true
  - name: dba-infra-p0
    webhook_configs:
      - url: http://exmarketing-alert-drill:8080/alertmanager/dba-infra-p0
        send_resolved: true
  - name: backend-oncall
    webhook_configs:
      - url: http://exmarketing-alert-drill:8080/alertmanager/backend-oncall
        send_resolved: true
  - name: backend-workqueue
    webhook_configs:
      - url: http://exmarketing-alert-drill:8080/alertmanager/backend-workqueue
        send_resolved: true
  - name: business-ops
    webhook_configs:
      - url: http://exmarketing-alert-drill:8080/alertmanager/business-ops
        send_resolved: true
  - name: platform-observability
    webhook_configs:
      - url: http://exmarketing-alert-drill:8080/alertmanager/platform-observability
        send_resolved: true

templates:
  - /etc/alertmanager/alertmanager-exmarketing.tmpl
